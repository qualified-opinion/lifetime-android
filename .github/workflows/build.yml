name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk lifetime-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lifetime-debug-apk
          path: lifetime-debug.apk

      # Every push publishes a downloadable "latest build" release so the APK can
      # be installed straight from a phone browser (no login, no unzipping).
      - name: Publish latest debug build
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" lifetime-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Debug build ($GITHUB_REF_NAME)" \
            --notes "Debug build of ${GITHUB_SHA::7} from $GITHUB_REF_NAME."
