name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6
        with:
          # Keep caching on the MIT-licensed provider.
          cache-provider: basic

      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk lifetime-debug.apk

      - uses: actions/upload-artifact@v7
        with:
          name: lifetime-debug-apk
          path: lifetime-debug.apk

      # Every push publishes a downloadable "latest build" release so the APK can
      # be installed straight from a phone browser (no login, no unzipping).
      - name: Publish latest debug build
        # Dependabot runs get a read-only token, so they skip publishing.
        if: github.event_name == 'push' && github.actor != 'dependabot[bot]'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" lifetime-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Debug build ($GITHUB_REF_NAME)" \
            --notes "Debug build of ${GITHUB_SHA::7} from $GITHUB_REF_NAME."

      # Room writes its schema to app/schemas during the build. Fail if a schema change
      # wasn't committed, so database changes always show up in review.
      - name: Check Room schema is committed
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            echo "::error::Room schema changed. Commit the files below."
            git status --porcelain app/schemas
            find app/schemas -name '*.json' -exec sh -c 'echo "----- $1"; cat "$1"' _ {} \;
            exit 1
          fi

      # Guardrails: Android lint, and a minified (R8) release build so shrinking problems
      # show up here rather than in a signed release. The release APK is unsigned and not kept.
      - name: Lint and R8 release build
        run: ./gradlew --no-daemon lintDebug assembleRelease -Plifetime.minify=true

      - name: Show lint report
        if: always()
        run: cat app/build/reports/lint-results-debug.txt 2>/dev/null || echo "No lint report."
