name: Build APK

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk lifetime-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: lifetime-debug-apk
          path: lifetime-debug.apk

      # Every push publishes a downloadable "latest build" release so the APK can
      # be installed straight from a phone browser (no login, no unzipping).
      - name: Publish latest debug build
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-${GITHUB_REF_NAME//\//-}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" lifetime-debug.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Debug build ($GITHUB_REF_NAME)" \
            --notes "Debug build of ${GITHUB_SHA::7} from $GITHUB_REF_NAME."

      # Room writes its schema to app/schemas during the build. Fail if a schema change
      # wasn't committed, so database changes always show up in review.
      - name: Check Room schema is committed
        run: |
          if [ -n "$(git status --porcelain app/schemas)" ]; then
            echo "::error::Room schema changed. Commit the files below."
            git status --porcelain app/schemas
            find app/schemas -name '*.json' -exec sh -c 'echo "----- $1"; cat "$1"' _ {} \;
            exit 1
          fi

  signed:
    # Signed release APK. Pull requests from forks can't see secrets, so skip those.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Accepts the common names for the four signing secrets and uses whichever are set.
      # Only secret *names* are ever printed, never values.
      - name: Prepare signing key
        env:
          KS_1: ${{ secrets.KEYSTORE_BASE64 }}
          KS_2: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
          KS_3: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_4: ${{ secrets.SIGNING_KEY }}
          KS_5: ${{ secrets.KEYSTORE }}
          KS_6: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KS_7: ${{ secrets.ANDROID_SIGNING_KEY }}
          KS_8: ${{ secrets.KEYSTORE_FILE }}
          SP_1: ${{ secrets.KEYSTORE_PASSWORD }}
          SP_2: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SP_3: ${{ secrets.KEY_STORE_PASSWORD }}
          SP_4: ${{ secrets.STORE_PASSWORD }}
          SP_5: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SP_6: ${{ secrets.RELEASE_STORE_PASSWORD }}
          SP_7: ${{ secrets.SIGNING_KEYSTORE_PASSWORD }}
          KA_1: ${{ secrets.KEY_ALIAS }}
          KA_2: ${{ secrets.SIGNING_KEY_ALIAS }}
          KA_3: ${{ secrets.ALIAS }}
          KA_4: ${{ secrets.ANDROID_KEY_ALIAS }}
          KA_5: ${{ secrets.RELEASE_KEY_ALIAS }}
          KA_6: ${{ secrets.KEYSTORE_ALIAS }}
          KP_1: ${{ secrets.KEY_PASSWORD }}
          KP_2: ${{ secrets.SIGNING_KEY_PASSWORD }}
          KP_3: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KP_4: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KP_5: ${{ secrets.KEY_STORE_KEY_PASSWORD }}
        run: |
          pick() { for v in $(compgen -v | grep "^$1_" | sort); do if [ -n "${!v}" ]; then echo "${!v}"; return; fi; done; }
          KS="$(pick KS)"; SP="$(pick SP)"; KA="$(pick KA)"; KP="$(pick KP)"
          missing=""
          [ -z "$KS" ] && missing="$missing keystore(base64)"
          [ -z "$SP" ] && missing="$missing store-password"
          [ -z "$KA" ] && missing="$missing key-alias"
          if [ -n "$missing" ]; then
            echo "::error::Signing secrets not found for:$missing. Expected e.g. KEYSTORE_BASE64, KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD."
            exit 1
          fi
          [ -z "$KP" ] && KP="$SP" # many keystores use the same password for the key
          mkdir -p "$RUNNER_TEMP/signing"
          # Strip whitespace/newlines so a pasted multi-line base64 still decodes.
          echo "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/signing/release.jks"
          echo "::add-mask::$SP"; echo "::add-mask::$KP"
          {
            echo "SIGNING_KEYSTORE_PATH=$RUNNER_TEMP/signing/release.jks"
            echo "SIGNING_STORE_PASSWORD=$SP"
            echo "SIGNING_KEY_ALIAS=$KA"
            echo "SIGNING_KEY_PASSWORD=$KP"
          } >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew --no-daemon assembleRelease

      - name: Verify signature
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/app-release.apk | grep -E "Signer #1 certificate (DN|SHA-256)"
          cp app/build/outputs/apk/release/app-release.apk lifetime.apk
          rm -rf "$RUNNER_TEMP/signing"

      - uses: actions/upload-artifact@v4
        with:
          name: lifetime-signed-apk
          path: lifetime.apk

      # main publishes "Lifetime (latest)"; other branches publish a pre-release for testing.
      - name: Publish signed build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            TAG="signed-latest"; FLAGS="--latest"; TITLE="Lifetime (signed, build ${GITHUB_RUN_NUMBER})"
          else
            TAG="signed-${GITHUB_REF_NAME//\//-}"; FLAGS="--prerelease"; TITLE="Signed build ($GITHUB_REF_NAME)"
          fi
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" lifetime.apk $FLAGS \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --notes "Signed release build ${GITHUB_RUN_NUMBER} of ${GITHUB_SHA::7} (versionCode ${GITHUB_RUN_NUMBER})."
